name: RESONATE base-build tests
on:
  push:
    branches:
      - develop/v1.0-base
      - fix/one-card-uat
      - integration/astrology-uat
  pull_request:
    branches:
      - integration/astrology-uat
      - develop/v1.0-base
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check deck-engine.js
          node --check data.js
          node --check journal.js
          node --check reading-stage.js
          node --check astrology-prelude.js
          node --check astrology-prelude-ui.js
          node --check reading-pdf.js
          node --check opening-dice.js
          node --check reading-session.js
          node --check navigation-a11y.js
      - name: Run unit tests
        run: node --test tests/*.test.cjs
