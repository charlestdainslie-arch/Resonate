<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Max Chasroom voice comparison</title>
<style>
  :root { --bg: #0a0908; --panel: #15120d; --gold: #c9a96a; --gold-bright: #dfc48b; --text: #f2ede4; --muted: #b9b2a5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; letter-spacing: .14em; color: var(--gold-bright); margin: 8px 0; }
  .note { color: var(--muted); font-size: 14px; }
  section { background: var(--panel); border: 1px solid rgba(201,169,106,.3); border-radius: 14px; padding: 14px; margin: 14px 0; }
  h2 { font-size: 16px; margin: 0 0 4px; color: var(--gold-bright); }
  blockquote { margin: 6px 0 10px; color: var(--muted); font-style: italic; }
  .sample { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid rgba(201,169,106,.15); }
  .sample b { color: var(--gold); font-weight: 600; }
  .sample small { color: var(--muted); }
  audio { width: 100%; }
  .grade { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .grade button { min-width: 44px; min-height: 44px; border-radius: 10px; border: 1px solid var(--gold); background: transparent; color: var(--gold-bright); font-size: 15px; }
  .grade button[aria-pressed="true"] { background: var(--gold); color: #000; }
  .grade input { flex: 1; min-width: 160px; min-height: 44px; border-radius: 10px; border: 1px solid rgba(201,169,106,.4); background: #000; color: var(--text); padding: 0 10px; }
  .browser { border: 1px dashed var(--gold); border-radius: 10px; padding: 8px; }
  .actions button { min-height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: var(--gold); color: #000; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>MAX CHASROOM · VOICE COMPARISON</h1>
  <p class="note" id="meta"></p>
  <p class="note">Private, on this computer only. Grade each sample 1 (no) to 5 (that's me). Grades stay in this browser; "Save grades" downloads them as a file you can share if you choose.</p>
  <div id="list"></div>
  <p class="actions"><button type="button" id="save">Save grades</button></p>
</main>
<script src="results.js"></script>
<script>
(function () {
  const R = window.RESULTS;
  const list = document.getElementById('list');
  if (!R) { list.innerHTML = '<p>No results yet. Run compare.py first.</p>'; return; }
  document.getElementById('meta').textContent = `Consent: ${R.consent} · ${R.machine} · made ${R.generated}`;
  let grades = {};
  try { grades = JSON.parse(localStorage.getItem('mc-voice-grades') || '{}'); } catch (e) {}
  const store = () => { try { localStorage.setItem('mc-voice-grades', JSON.stringify(grades)); } catch (e) {} };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  for (const script of R.scripts) {
    const samples = R.samples.filter(s => s.script === script.id);
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${esc(script.title)}</h2><blockquote>${esc(script.text)}</blockquote>` +
      samples.map(s => `<div class="sample"><div><b>${esc(s.model)} · ${esc(s.setting)}</b> <small>${s.audio_s} s of audio, made in ${s.make_s} s (${s.rtf}× real time)</small></div>
        <audio controls preload="none" src="${esc(s.file)}"></audio>
        <div class="grade" data-file="${esc(s.file)}">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-n="${n}" aria-pressed="${grades[s.file]?.n === n}">${n}</button>`).join('')}
        <input type="text" placeholder="Notes (accent, pace, warmth…)" value="${esc(grades[s.file]?.note || '')}" aria-label="Notes for ${esc(s.file)}"></div></div>`).join('') +
      `<div class="sample browser"><div><b>Browser voice (NOT Chas)</b> <small>your device's built-in speech, for comparison only</small></div><div class="grade"><button type="button" data-say="${esc(script.id)}" style="min-width:120px">▶ Play</button></div></div>`;
    list.appendChild(sec);
  }
  list.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.say) { const s = R.scripts.find(x => x.id === b.dataset.say); speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(s.text)); return; }
    const box = b.closest('.grade'), file = box.dataset.file;
    grades[file] = { ...(grades[file] || {}), n: Number(b.dataset.n) };
    box.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    store();
  });
  list.addEventListener('input', e => {
    const box = e.target.closest('.grade'); if (!box || !box.dataset.file) return;
    grades[box.dataset.file] = { ...(grades[box.dataset.file] || {}), note: e.target.value }; store();
  });
  document.getElementById('save').onclick = () => {
    const blob = new Blob([JSON.stringify({ generated: R.generated, grades }, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'voice-grades.json'; a.click();
  };
})();
</script>
</body>
</html>
